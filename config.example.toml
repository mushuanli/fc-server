listen = "127.0.0.1:8790"
api_key_env = "FIRECRACKER_API_KEY"
jailer = "/usr/local/bin/jailer"
firecracker = "/usr/local/bin/firecracker"
state_dir = "/var/lib/mindos-firecracker"
port_publisher = "/usr/local/libexec/mindos-firecracker/publish-ports.py"
uid_base = 200000
max_vms = 4

[profiles.debian13]
kernel = "/var/lib/mindos-images/vmlinux"
rootfs = "/var/lib/mindos-images/debian13.ext4"
vcpus = 2
memory_mib = 1024
max_lifetime_secs = 3600
startup_timeout_secs = 20
max_connections = 16
ports = [7000]
bindings = ["project", "codex", "claude", "dsh"]

# Optional pre-provisioned TAP/netns slots, indexed by the global VM uid slot.
# Supply max_vms entries; the service never creates NAT or broadens firewall rules.
# [[profiles.debian13.network_slots]]
# tap = "fc0"
# netns = "/run/netns/harness"
# guest_mac = "02:FC:00:00:00:01"

[bindings.project]
source = "/srv/harness/project"
target = "/workspace/project"
read_only = false
size_mib = 2048

[bindings.codex]
source = "/srv/harness/codex-home"
target = "/home/agent/.codex"
read_only = false
size_mib = 512

[bindings.claude]
source = "/srv/harness/claude-home"
target = "/home/agent/.claude"
read_only = false
size_mib = 512

[bindings.dsh]
source = "/srv/harness/dsh-home"
target = "/home/agent/.dsh"
read_only = false
size_mib = 512
